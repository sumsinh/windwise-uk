
services:
  backend:
    build:
      context: ./backend
    container_name: windwise-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: windwise-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://127.0.0.1:8000
    depends_on:
      - backend
